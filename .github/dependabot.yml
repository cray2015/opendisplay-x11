#
# Keeps the SHA-pinned GitHub Actions current. Python dependencies come from Ubuntu
# packages (debian/control), which Ubuntu's own security updates cover.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7          # let a new release age a week before proposing it
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
  - package-ecosystem: docker
    directory: /tests/x11            # the X11 test image's pinned Ubuntu base
    schedule:
      interval: weekly
    # Tests run on the Ubuntu the package targets (24.04 = Linux Mint 22): take refreshed
    # 24.04 images (new digests), never a new Ubuntu release.
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "CI"
