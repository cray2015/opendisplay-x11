#
# OpenSSF Scorecard: rates the repository's security practices (branch protection, pinned
# dependencies, token permissions, …) and publishes the result for the README badge.
# Kept in its own file: publishing requires the workflow to use only approved actions.
name: Scorecard

on:
  schedule:
    - cron: "31 4 * * 1"
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read            # read workflow runs (Pinned-Dependencies, CI checks)
      security-events: write   # upload to code scanning
      id-token: write          # publish the results (badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 14
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif
