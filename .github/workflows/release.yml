#
# A version tag (v0.4.2) publishes a GitHub Release: the .deb built from that tag on
# GitHub's runners, its SHA256, an SPDX SBOM, and a signed build-provenance attestation
# (verify with: gh attestation verify <file>.deb -R cray2015/opendisplay-x11).
# The release notes are the tag's debian/changelog entry.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false     # never cancel a release half-way

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation (Sigstore)
      attestations: write    # store it on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            dpkg-dev lintian debhelper dh-python pybuild-plugin-pyproject python3-all \
            python3-setuptools python3-pytest python3-gi desktop-file-utils appstream
          dpkg-checkbuilddeps

      - name: Tag must match the changelog version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(dpkg-parsechangelog -S Version)
          [ "${TAG#v}" = "$version" ] || { echo "tag $TAG does not match debian/changelog $version"; exit 1; }

      - name: Build (runs the unit tests and metadata validation) and lint
        id: build
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          mv ../opendisplay-x11_*_all.deb ../opendisplay-x11_*.buildinfo dist/   # .buildinfo: exact toolchain, for rebuilders
          lintian --fail-on error,warning dist/opendisplay-x11_*_all.deb
          (cd dist && sha256sum opendisplay-x11_*_all.deb > SHA256SUMS && cat SHA256SUMS)
          echo "deb=$(ls dist/opendisplay-x11_*_all.deb)" >> "$GITHUB_OUTPUT"

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          file: ${{ steps.build.outputs.deb }}
          format: spdx-json
          output-file: dist/opendisplay-x11.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.deb }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            dpkg-parsechangelog -S Changes | tail -n +4
            echo
            echo "### Verify this download"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify opendisplay-x11_${TAG#v}_all.deb -R $REPO"
            echo '```'
            echo
            echo "Or rebuild it from this tag and compare: see TRUST.md."
          } > notes.md
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file notes.md \
            dist/opendisplay-x11_*_all.deb dist/opendisplay-x11_*.buildinfo dist/SHA256SUMS dist/opendisplay-x11.spdx.json
