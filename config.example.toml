# odx11 config — copy to ~/.config/odx11/config.toml and edit.
# Every key is optional; the values below are the defaults.
# Unknown keys are rejected, so a typo fails loudly instead of being ignored.
# (tests/test_config.py checks this file parses to exactly the defaults.)

[service]
enabled = true                        # start automatically at login; false = only when started by hand

[notifications]
enabled = true                        # desktop notifications from the service
connected = true                      # "iPad connected — desktop extended"
needs_action = true                   # "Open OpenDisplay on your iPad"
disconnected = true                   # "iPad disconnected"
problems = true                       # "Setup needed: …"

[transport]
usbmuxd_socket = "/var/run/usbmuxd"
device_port = 9000                    # port the OpenDisplay receiver listens on

[display]
connector = "auto"                    # "auto" = first free HDMI port; or e.g. "HDMI-A-2" (see /sys/class/drm)
# main_output = "HDMI-3"              # xrandr output to place beside; default: the primary output
divisor = 1.5                         # logical mode = iPad panel / divisor, floored to 16 (§8.2)
refresh_hz = 60                       # refresh of the generated `cvt -r` mode
connect_timeout_s = 5.0               # how long to wait for the forced output to appear
settle_timeout_s = 3.0                # how long to let Cinnamon restore its saved layout first

[video]
fps = 30
qp = 26                               # CQP quantiser, 0..51: lower = sharper and bigger
keyframe_period = 1000000             # frames between unprompted IDRs; large = effectively never
show_pointer = true                   # draw the cursor into the video (until the cursor channel, M4)
convert_threads = 2                   # software colour-conversion threads
idle_pause_s = 1.0                    # stop capturing after this long with nothing changing; 0 = always capture

[input]
scroll_step_px = 40                   # video pixels of two-finger scroll per wheel click
tap_slop_px = 8.0                     # finger movement (px) beyond which a touch becomes a drag
long_press_ms = 500                   # hold a touch still this long, then lift, to right-click

[session]
ping_interval_s = 2.0                 # max 2: the receiver drops a sender silent for 5 s
silence_timeout_s = 5.0               # end the session after this long without bytes from the iPad
grace_s = 10.0                        # after a drop (app switch, lock), keep the monitor this long
redial_s = 3.0                        # how often to retry while the app is not open
redial_grace_s = 1.0                  # retry faster during the grace period
rotation_debounce_ms = 300            # wait for rotation to settle before rebuilding

# Per-iPad settings, keyed by the `id` the receiver sends in `hello`
# (`odx11 run --verbose` logs it). Defaults: side = "right", align = "start".
# Placement belongs to Cinnamon: arrange the iPad in Display settings and it is
# remembered. side/align only apply when Cinnamon has no saved layout yet.
# [devices.7C62722D-9FE3-4473-B88A-D30DFBE0A4DA]
# side = "right"                      # left | right | above | below the main output
# align = "start"                     # start | center | end along that edge
# mode = [1568, 1088]                 # landscape override, multiples of 16
