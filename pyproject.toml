[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odx11"
version = "0.4.3"
description = "iPad as an X11 second monitor over USB, via the OpenDisplay protocol"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Vibhanshu Biswas"}]
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
               "Environment :: X11 Applications :: GTK", "Operating System :: POSIX :: Linux"]
# PyGObject, GStreamer typelibs and python-xlib come from apt (see CLAUDE.md).
dependencies = []

[project.scripts]
odx11 = "odx11.__main__:main"

[tool.setuptools]
packages = ["odx11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"          # debian/control: python3 (>= 3.11) — flags newer syntax
extend-exclude = ["spike"]        # throwaway M0 scripts, not shipped

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]   # pycodestyle, pyflakes, bugbear, bandit's security rules
# Subprocess calls (S603/S607): each one is listed in TRUST.md and new ones are caught by the
# capability check (.semgrep/capabilities.yml), which is the review point for them.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]             # pytest asserts

# Mutation testing (scheduled CI job): the pure modules, where the unit tests are the
# only check. Hardware-facing modules are verified by hand (PROJECT_SPEC.md §10).
[tool.mutmut]
source_paths = ["odx11"]
pytest_add_cli_args_test_selection = ["tests"]
# edid.py is excluded: it serves only the boot-time EDID fallback, unused at runtime (docs/decisions.md).
only_mutate = ["odx11/protocol.py", "odx11/annexb.py", "odx11/config.py", "odx11/state.py",
               "odx11/settings.py", "odx11/input.py", "odx11/cursor.py", "odx11/pipeline.py"]
also_copy = ["config.example.toml", "pyproject.toml", "debian", "packaging"]
