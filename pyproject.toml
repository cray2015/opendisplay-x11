[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odx11"
version = "0.4.2"
description = "iPad as an X11 second monitor over USB, via the OpenDisplay protocol"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Vibhanshu Biswas"}]
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
               "Environment :: X11 Applications :: GTK", "Operating System :: POSIX :: Linux"]
# PyGObject, GStreamer typelibs and python-xlib come from apt (see CLAUDE.md).
dependencies = []

[project.scripts]
odx11 = "odx11.__main__:main"

[tool.setuptools]
packages = ["odx11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
